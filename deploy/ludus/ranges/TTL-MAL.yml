# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json
#
# TTL-MAL: malware analysis, following OALabs' two-VM setup. About 17 GB RAM.
# - static (VLAN 120): Windows 11 with the analysis tools and internet.
#   Samples are stored here but never run.
# - dynamic (VLAN 190): Windows 11 with the same tools plus debugging and
#   monitoring tools, and Elastic Agent. Samples run here, only in testing
#   mode: entering it snapshots dynamic and cuts its internet (static keeps
#   internet), leaving it reverts dynamic.
# The VLANs cannot reach each other. Files reach dynamic over WinRM, only
# while it is clean; from WireGuard it accepts only RDP and WinRM.
# Tools come from our role ttl_re_tools (deploy/ludus/roles). See docs/ranges.md.

# Windows reads the Proxmox host's clock as local time in this zone, so it
# must be the host's zone or Windows clocks (and Elastic timestamps) are
# hours off. TTL_TIMEZONE (a tz name such as Region/City) is filled from
# siem.env at upload, so the owner's zone stays out of this public repo.
defaults:
  timezone: "TTL_TIMEZONE"

# Elastic Agent enrolls in the shared Elastic on TTL-SIEM (see
# TTL-SIEM.yml). Replace both placeholders when uploading the config:
# TTL_SIEM_WAN is TTL-SIEM's router address, 192.0.2.(100 + its range
# number), and TTL_MAL_ENROLLMENT_TOKEN is the enrollment token of the
# TTL-MAL agent policy. Never commit the real token.
global_role_vars:
  ludus_elastic_fleet_server: "https://TTL_SIEM_WAN:8220"
  ludus_elastic_enrollment_token: "TTL_MAL_ENROLLMENT_TOKEN"

router:
  vm_name: "{{ range_id }}-router-debian12-x64"
  hostname: "{{ range_id }}-router"
  template: debian-12-x64-server-template
  ram_gb: 1
  cpus: 2

ludus:
  - vm_name: "{{ range_id }}-static"
    hostname: "{{ range_id }}-static"
    template: win11-22h2-x64-enterprise-template
    vlan: 120
    ip_last_octet: 20
    ram_gb: 8
    cpus: 4
    windows:
      sysprep: false
    roles:
      - ttl_re_tools
    role_vars:
      ttl_re_tools_profile: static
    testing:
      snapshot: false # keeps your notes and work
      block_internet: false # online even in testing mode

  - vm_name: "{{ range_id }}-dynamic"
    hostname: "{{ range_id }}-dynamic"
    template: win11-22h2-x64-enterprise-template
    vlan: 190
    ip_last_octet: 21
    ram_gb: 8
    cpus: 4
    windows:
      sysprep: false
    roles:
      - badsectorlabs.ludus_elastic_agent
      - ttl_re_tools
    role_vars:
      ttl_re_tools_profile: dynamic
    testing:
      snapshot: true # reverted when testing mode ends
      block_internet: true

network:
  inter_vlan_default: REJECT # static and dynamic cannot reach each other
  # Range VMs never open connections to WireGuard clients (the owner's
  # machine, ttl-agents). Ludus's default; stated so it is never changed.
  wireguard_vlan_default: REJECT
  rules:
    # From WireGuard, dynamic accepts only the GUI (RDP) and tool commands
    # and file transfers (WinRM). No SMB. Transfers happen only while
    # dynamic is clean, before a sample runs (docs/ranges.md).
    # Ludus inserts each WireGuard rule at the top of the router's chain,
    # so they apply in REVERSE order: keep the DROP above the ACCEPT here.
    # Without the DROP, the per-user WireGuard access grants allow every port.
    - name: "WireGuard to dynamic: nothing else"
      vlan_src: wireguard
      vlan_dst: 190
      ip_last_octet_dst: 21
      protocol: all
      ports: all
      action: DROP
    - name: "WireGuard to dynamic: RDP and WinRM only"
      vlan_src: wireguard
      vlan_dst: 190
      ip_last_octet_dst: 21
      protocol: tcp
      ports: 3389,5985,5986
      action: ACCEPT
  # Layer 1 of 2: the range router never forwards to private networks
  # outside the range. Layer 2 is a firewall on the Ludus host that agents
  # cannot change. Keep this block; see docs/ranges.md.
  always_blocked_networks:
    - 192.168.0.0/16
    - 172.16.0.0/12

# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json
#
# TTL-MAL: malware and app analysis. About 27 GB RAM.
# VLAN 10 is the detonation network (victim, flare, remnux). The victim
# sends telemetry to the shared Elastic on TTL-SIEM. After deploy, the
# victim and flare use remnux as their gateway and DNS, with a route to
# TTL-SIEM via the range router. See docs/ranges.md for the setup steps.
# Detonate only in testing mode: internet blocked, victim and flare
# snapshotted and reverted when testing ends.

# Elastic Agent enrolls in the shared Elastic on TTL-SIEM (see
# TTL-SIEM.yml). Replace both placeholders when uploading the config:
# TTL_SIEM_WAN is TTL-SIEM's router address, 192.0.2.(100 + its range
# number), and TTL_MAL_ENROLLMENT_TOKEN is the enrollment token of the
# TTL-MAL agent policy. Never commit the real token.
global_role_vars:
  ludus_elastic_fleet_server: "https://TTL_SIEM_WAN:8220"
  ludus_elastic_enrollment_token: "TTL_MAL_ENROLLMENT_TOKEN"

router:
  vm_name: "{{ range_id }}-router-debian12-x64"
  hostname: "{{ range_id }}-router"
  template: debian-12-x64-server-template
  ram_gb: 1
  cpus: 2

ludus:
  - vm_name: "{{ range_id }}-remnux"
    hostname: "{{ range_id }}-remnux"
    template: remnux-template
    vlan: 10
    ip_last_octet: 10
    ram_gb: 4
    cpus: 2
    linux: true
    testing:
      snapshot: false # keep PCAPs and INetSim logs across reverts
      block_internet: true

  - vm_name: "{{ range_id }}-victim"
    hostname: "{{ range_id }}-victim"
    template: win11-22h2-x64-enterprise-template
    vlan: 10
    ip_last_octet: 21
    ram_gb: 6
    cpus: 4
    windows:
      sysprep: false
    roles:
      - badsectorlabs.ludus_elastic_agent
    testing:
      snapshot: true
      block_internet: true

  - vm_name: "{{ range_id }}-flare"
    hostname: "{{ range_id }}-flare"
    template: flare-vm-template
    vlan: 10
    ip_last_octet: 22
    ram_gb: 16
    cpus: 4
    windows:
      sysprep: false
    testing:
      snapshot: true
      block_internet: true

network:
  inter_vlan_default: REJECT
  # Layer 1 of 2: the range router never forwards to private networks
  # outside the range. Layer 2 is a firewall on the Ludus host that agents
  # cannot change. Keep this block; see docs/ranges.md.
  always_blocked_networks:
    - 192.168.0.0/16
    - 172.16.0.0/12

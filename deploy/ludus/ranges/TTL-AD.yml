# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json
#
# TTL-AD: full GOAD (2 forests, 3 domains). About 29 GB RAM.
# The five GOAD VMs match GOAD's Ludus provider config
# (ad/GOAD/providers/ludus/config.yml); keep their VLAN and IPs, which
# GOAD's inventory expects. Deploy through the broker, then run GOAD's
# Ansible playbooks from kali. Do not use goad.sh -p ludus: it calls the
# Ludus API with its own key. See docs/ranges.md.

# Elastic Agent enrolls in the shared Elastic on TTL-SIEM (see
# TTL-SIEM.yml). Replace both placeholders when uploading the config:
# TTL_SIEM_WAN is TTL-SIEM's router address, 192.0.2.(100 + its range
# number), and TTL_AD_ENROLLMENT_TOKEN is the enrollment token of the
# TTL-AD agent policy. Never commit the real token.
global_role_vars:
  ludus_elastic_fleet_server: "https://TTL_SIEM_WAN:8220"
  ludus_elastic_enrollment_token: "TTL_AD_ENROLLMENT_TOKEN"

router:
  vm_name: "{{ range_id }}-router-debian12-x64"
  hostname: "{{ range_id }}-router"
  template: debian-12-x64-server-template
  ram_gb: 1
  cpus: 2

ludus:
  - vm_name: "{{ range_id }}-GOAD-DC01" # kingslanding, sevenkingdoms.local
    hostname: "{{ range_id }}-DC01"
    template: win2019-server-x64-template
    vlan: 10
    ip_last_octet: 10
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    roles:
      - badsectorlabs.ludus_elastic_agent

  - vm_name: "{{ range_id }}-GOAD-DC02" # winterfell, north.sevenkingdoms.local
    hostname: "{{ range_id }}-DC02"
    template: win2019-server-x64-template
    vlan: 10
    ip_last_octet: 11
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    roles:
      - badsectorlabs.ludus_elastic_agent

  - vm_name: "{{ range_id }}-GOAD-DC03" # meereen, essos.local
    hostname: "{{ range_id }}-DC03"
    template: win2016-server-x64-template
    vlan: 10
    ip_last_octet: 12
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    roles:
      - badsectorlabs.ludus_elastic_agent

  - vm_name: "{{ range_id }}-GOAD-SRV02" # castelblack, north
    hostname: "{{ range_id }}-SRV02"
    template: win2019-server-x64-template
    vlan: 10
    ip_last_octet: 22
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    roles:
      - badsectorlabs.ludus_elastic_agent

  - vm_name: "{{ range_id }}-GOAD-SRV03" # braavos, essos
    hostname: "{{ range_id }}-SRV03"
    template: win2019-server-x64-template
    vlan: 10
    ip_last_octet: 23
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    roles:
      - badsectorlabs.ludus_elastic_agent

  - vm_name: "{{ range_id }}-kali"
    hostname: "{{ range_id }}-kali"
    template: kali-x64-desktop-template
    vlan: 99
    ip_last_octet: 1
    ram_gb: 8
    cpus: 4
    linux: true
    testing:
      snapshot: false
      block_internet: false

network:
  # Layer 1 of 2: the range router never forwards to private networks
  # outside the range. Layer 2 is a firewall on the Ludus host that agents
  # cannot change. Keep this block; see docs/ranges.md.
  always_blocked_networks:
    - 192.168.0.0/16
    - 172.16.0.0/12

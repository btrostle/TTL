# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json
#
# TTL-WKS: basic AD network for workstation attacks. About 27 GB RAM.
# One DC, two Windows 11 workstations (for lateral movement), one Ubuntu
# server. Every endpoint runs Elastic Defend. Kali sits on its own VLAN.

# Elastic Agent enrolls in the shared Elastic on TTL-SIEM (see
# TTL-SIEM.yml). Replace both placeholders when uploading the config:
# TTL_SIEM_WAN is TTL-SIEM's router address, 192.0.2.(100 + its range
# number), and TTL_WKS_ENROLLMENT_TOKEN is the enrollment token of the
# TTL-WKS agent policy. Never commit the real token.
global_role_vars:
  ludus_elastic_fleet_server: "https://TTL_SIEM_WAN:8220"
  ludus_elastic_enrollment_token: "TTL_WKS_ENROLLMENT_TOKEN"

router:
  vm_name: "{{ range_id }}-router-debian12-x64"
  hostname: "{{ range_id }}-router"
  template: debian-12-x64-server-template
  ram_gb: 1
  cpus: 2

ludus:
  - vm_name: "{{ range_id }}-DC01"
    hostname: "{{ range_id }}-DC01"
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 11
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
      gpos:
        - disable_defender # Defend in detect mode records; Defender would block
    domain:
      fqdn: ttl.lab
      role: primary-dc
    roles:
      - badsectorlabs.ludus_elastic_agent

  - vm_name: "{{ range_id }}-WS01"
    hostname: "{{ range_id }}-WS01"
    template: win11-22h2-x64-enterprise-template
    vlan: 10
    ip_last_octet: 21
    ram_gb: 6
    cpus: 4
    windows:
      sysprep: true
    domain:
      fqdn: ttl.lab
      role: member
    roles:
      - badsectorlabs.ludus_elastic_agent

  - vm_name: "{{ range_id }}-WS02"
    hostname: "{{ range_id }}-WS02"
    template: win11-22h2-x64-enterprise-template
    vlan: 10
    ip_last_octet: 22
    ram_gb: 6
    cpus: 4
    windows:
      sysprep: true
    domain:
      fqdn: ttl.lab
      role: member
    roles:
      - badsectorlabs.ludus_elastic_agent

  - vm_name: "{{ range_id }}-linux"
    hostname: "{{ range_id }}-linux"
    template: ubuntu-22.04-x64-server-template
    vlan: 10
    ip_last_octet: 31
    ram_gb: 2
    cpus: 2
    linux: true
    roles:
      - badsectorlabs.ludus_elastic_agent

  - vm_name: "{{ range_id }}-kali"
    hostname: "{{ range_id }}-kali"
    template: kali-x64-desktop-template
    vlan: 99
    ip_last_octet: 1
    ram_gb: 8
    cpus: 4
    linux: true
    testing:
      snapshot: false
      block_internet: false

network:
  # Layer 1 of 2: the range router never forwards to private networks
  # outside the range. Layer 2 is a firewall on the Ludus host that agents
  # cannot change. Keep this block; see docs/ranges.md.
  always_blocked_networks:
    - 192.168.0.0/16
    - 172.16.0.0/12
